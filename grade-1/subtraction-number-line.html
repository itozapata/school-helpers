<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtraction Number Lines 1–10</title>
<style>
  :root {
    --problems: 6;           /* problems per page */
    --ink: #111;             /* main text + number line */
    --accent: #111;       /* everything prints in black & white */
    --soft: #fff;
    --card-border: #888;
    --problem-size: 34px;
    --number-size: 17px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", sans-serif;
    margin: 0; padding: 24px; color: var(--ink);
    background: #fdf6ec radial-gradient(#e2e2e2 1.5px, transparent 1.5px) 0 0 / 22px 22px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  /* ---------- screen controls ---------- */
  .controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .controls button, .controls label {
    font: inherit; font-size: 17px; font-weight: 700; padding: 8px 18px;
    border-radius: 999px; border: 3px solid var(--ink); background: #fff; color: var(--ink);
    cursor: pointer; box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
    display: inline-flex; align-items: center; gap: 6px; user-select: none;
  }
  .controls button:active, .controls label:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .controls #shuffle { background: var(--accent); color: #fff; }

  /* ---------- the sheet ---------- */
  .page {
    width: 8in; margin: 0 auto; padding: 0.35in 0.45in 0.3in;
    background: #fff; border-radius: 18px; box-shadow: 0 8px 30px rgba(45,48,71,.15);
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 4px; }
  header h1 { margin: 0; font-size: 34px; font-weight: 800; line-height: 1; color: var(--accent); }
  header h1 small { display: block; font-size: 16px; font-weight: 600; color: var(--ink); opacity: .7; margin-top: 4px; }
  .who { font-size: 17px; display: grid; gap: 4px; text-align: right; }
  .who span { display: inline-block; width: 1.9in; border-bottom: 2px solid var(--ink); }
  .hint {
    margin: 10px 0 12px; padding: 6px 14px; font-size: 16px;
    border: 2px dashed var(--card-border); border-radius: 12px; background: #fff;
  }
  .hint b { color: var(--accent); }

  .problem {
    display: grid; grid-template-columns: max-content 1fr; align-items: center; gap: 36px;
    padding: 6px 18px; margin-bottom: 8px; position: relative;
    border: none; background: none;
    break-inside: avoid; overflow: hidden;
  }
    .eq { font-size: var(--problem-size); font-weight: 800; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .eq .blank {
    display: inline-block; width: 1.4em; height: 1.4em; text-align: center; line-height: 1.4em; flex: none;
    background: #fff; border: 2.5px solid var(--ink); border-radius: 10px; color: var(--accent);
  }
  .eq .n { width: 1.3em; text-align: center; flex: none; }
  .eq .op { width: 0.8em; text-align: center; flex: none; }
  svg { width: 100%; height: 86px; display: block; overflow: visible; }
  svg text { font-size: var(--number-size); font-family: inherit; font-weight: 700; fill: var(--ink); }

  /* ---------- self-assessment ---------- */
  .selfcheck {
    margin-top: 12px; padding: 10px 18px;
    border: 2px dashed var(--card-border); border-radius: 14px; background: #fff;
    break-inside: avoid;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .selfcheck .sc-label { flex: none; }
  .selfcheck .sc-head { font-size: 22px; font-weight: 800; color: var(--accent); }
  .selfcheck .sc-sub { font-size: 15px; font-weight: 600; opacity: .7; }
  .selfcheck .sc-options {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 30px; flex: 1;
  }
  .selfcheck .sc-opt {
    font-size: 24px; font-weight: 800; text-align: center;
    padding: 8px 24px; border-radius: 999px; white-space: nowrap;
  }

  footer { text-align: center; font-size: 15px; margin-top: 4px; opacity: .75; }

  @media print {
    @page { size: letter; margin: 0.35in; }
    body { background: #fff; padding: 0; }
    .controls { display: none; }
    .page { box-shadow: none; width: auto; padding: 0; border-radius: 0; }
  }
</style>
</head>
<body>
  <div class="controls">
    <button id="shuffle">🎲 New Problems</button>
    <label><input type="checkbox" id="answers"> Answer key</label>
    <button onclick="window.print()">🖨️ Print</button>
  </div>

  <div class="page">
    <header>
      <h1>Hop Back! 🐸<small>Subtraction on the number line</small></h1>
      <div class="who">
        <div>Name: <span></span></div>
        </div>
    </header>
    <p class="hint">Put your finger on the <b>first number</b>. Draw <b>one hop back</b> for each number you take away. Write where you land!</p>
    <div id="problems"></div>
    <div class="selfcheck">
      <div class="sc-label">
        <div class="sc-head">This was:</div>
        <div class="sc-sub">(circle one)</div>
      </div>
      <div class="sc-options">
        <span class="sc-opt">😊 Easy</span>
        <span class="sc-opt">🙂 Just Right</span>
        <span class="sc-opt">😅 Hard</span>
      </div>
    </div>
    <footer>⭐ Great hopping! ⭐</footer>
  </div>

<script>
  const MIN = 1, MAX = 10;
  const css = getComputedStyle(document.documentElement);
  const COUNT = parseInt(css.getPropertyValue('--problems')) || 10;
    const box = document.getElementById('problems');
  const answersBox = document.getElementById('answers');
  let problems = [];

  // a − b = c with every value (a, b, c) between 1 and 10.
  function makeProblems() {
    const all = [];
    for (let a = MIN + 1; a <= MAX; a++)
      for (let b = 1; a - b >= MIN; b++) all.push([a, b]);
    for (let i = all.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [all[i], all[j]] = [all[j], all[i]];
    }
    return all.slice(0, COUNT);
  }

  // Number line 1–10. In answer-key mode, draws the hops back from a to a−b.
  function numberLine(a, b, show) {
    const W = 480, pad = 14, y = 80, step = (W - 2 * pad) / (MAX - MIN);
    const X = n => pad + (n - MIN) * step;
    let s = `<svg viewBox="0 0 ${W} 110" preserveAspectRatio="xMidYMid meet">`;
    s += `<line x1="2" y1="${y}" x2="${W - 2}" y2="${y}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
    for (let n = MIN; n <= MAX; n++) {
      s += `<line x1="${X(n)}" y1="${y - 6}" x2="${X(n)}" y2="${y + 6}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
      s += `<text x="${X(n)}" y="${y + 23}" text-anchor="middle">${n}</text>`;
    }
    if (show) {
      for (let n = a; n > a - b; n--) {
        const x1 = X(n), x2 = X(n - 1), mid = (x1 + x2) / 2;
        s += `<path d="M${x1} ${y - 7} Q${mid} ${y - 40} ${x2 + 3} ${y - 8}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>`;
      }
      s += `<circle cx="${X(a)}" cy="${y}" r="5" fill="#fff" stroke="var(--ink)" stroke-width="1.5"/>`;
      s += `<circle cx="${X(a - b)}" cy="${y}" r="6" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/>`;
    }
    return s + '</svg>';
  }

  function render() {
    const show = answersBox.checked;
    box.innerHTML = problems.map(([a, b], i) => {
      return `
      <div class="problem">
        <div class="eq"><span class="n">${a}</span><span class="op">−</span><span class="n">${b}</span><span class="op">=</span><span class="blank">${show ? a - b : ''}</span></div>
        ${numberLine(a, b, show)}
      </div>`;
    }).join('');
  }

  document.getElementById('shuffle').onclick = () => { problems = makeProblems(); render(); };
  answersBox.onchange = render;
  problems = makeProblems();
  render();
</script>
</body>
</html>
